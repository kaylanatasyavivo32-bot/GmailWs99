<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmailws99</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gmailws99 Store</h2>
    <form id="storeForm">
        <input type="text" id="email" placeholder="Masukkan Email atau Data" required>
        <button type="submit">Kirim Storan</button>
    </form>
</div>

<script>
const TOKEN = "8893225653:AAHustSNfq35Aak02kv645L_NhE9iLbgWE";
const CHAT_ID = "7562493003";

document.getElementById('storeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const emailData = document.getElementById('email').value;
    const text = `📥 *Storan Baru Masuk!*\n\nData: ${emailData}`;

    const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
    
    try {
        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'Markdown'
            })
        });

        if (response.ok) {
            alert('Berhasil dikirim ke Telegram!');
            document.getElementById('storeForm').reset();
        } else {
            alert('Gagal mengirim.');
        }
    } catch (err) {
        alert('Terjadi kesalahan jaringan.');
    }
});
</script>

</body>
</html>
